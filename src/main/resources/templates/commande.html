<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<title>ShopNow — Confirmation de commande</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; color: #262A2E; background: #FFFFFF; }
  header { background: #FFFFFF; border-bottom: 2px solid #2F6B4F; padding: 14px 24px; }
  .brand { font-size: 20px; font-weight: 800; color: #1F4F37; text-decoration: none; }
  .corps { max-width: 720px; margin: 24px; }
  .statut-box { border: 1px solid #E2E8E3; border-left: 6px solid #2F6B4F; background: #F7F9F8; padding: 18px 20px; margin: 12px 0; }
  .statut-label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #5C6773; }
  #statut, [data-testid=statut] { font-size: 22px; font-weight: 800; color: #1F4F37; }
  table { width: 100%; border-collapse: collapse; margin: 12px 0; }
  th { text-align: left; color: #5C6773; font-size: 13px; border-bottom: 2px solid #2F6B4F; padding: 6px 8px; }
  td { border-bottom: 1px solid #E2E8E3; padding: 8px; }
  .paiement { border: 1px solid #E2E8E3; border-radius: 8px; padding: 16px; margin-top: 18px; max-width: 420px; }
  .paiement h3 { margin-top: 0; color: #1F4F37; }
  .paiement input { width: 100%; padding: 9px; border: 1px solid #D8E0DA; border-radius: 6px; margin: 6px 0 12px; }
  .btn { background: #2F6B4F; color: #FFFFFF; border: 0; border-radius: 6px; padding: 12px 20px; font-weight: 800; cursor: pointer; }
  a.lien { display: inline-block; margin-top: 16px; color: #2F6B4F; }
</style>
</head>
<body>
<header><a class="brand" href="/">ShopNow</a></header>

<div class="corps">
  <h1>Commande n° <span th:text="${commande.id}">42</span></h1>

  <div class="statut-box">
    <div class="statut-label">Statut de la commande</div>
    <div data-testid="statut" th:text="${libelleStatut}">COMMANDE CRÉÉE</div>
  </div>

  <table>
    <tr><th>Produit</th><th>Quantité</th><th>Sous-total</th></tr>
    <tr th:each="ligne : ${commande.lignes}">
      <td th:text="${ligne.nomProduit}">Produit</td>
      <td th:text="${ligne.quantite}">1</td>
      <td th:text="'€ ' + ${#numbers.formatDecimal(ligne.sousTotal,1,2)}">10.00</td>
    </tr>
  </table>
  <div><strong th:text="'Total : € ' + ${#numbers.formatDecimal(commande.total,1,2)}">Total</strong></div>

  <div class="paiement" th:if="${commande.statut.name() != 'PAYEE'}">
    <h3>Paiement (simulé)</h3>
    <p style="color:#5C6773;font-size:13px;">Tout numéro de carte à 16 chiffres est accepté (ex. 4111 1111 1111 1111).</p>
    <form action="/paiement/effectuer" method="post">
      <input type="hidden" name="commandeId" th:value="${commande.id}"/>
      <label>Numéro de carte</label>
      <input type="text" name="numeroCarte" data-testid="numero-carte" placeholder="4111 1111 1111 1111"/>
      <button class="btn" type="submit" data-testid="payer">Payer</button>
    </form>
  </div>
  <div th:if="${commande.statut.name() == 'PAYEE'}">
    <p style="color:#2F6B4F;font-weight:700;">Paiement accepté — merci !</p>
  </div>

  <a class="lien" href="/commandes">Voir mes commandes</a>
</div>
</body>
</html>
