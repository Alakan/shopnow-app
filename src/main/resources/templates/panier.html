<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<title>ShopNow — Panier</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; color: #262A2E; background: #FFFFFF; }
  header { background: #FFFFFF; border-bottom: 2px solid #2F6B4F; padding: 14px 24px; }
  .brand { font-size: 20px; font-weight: 800; color: #1F4F37; text-decoration: none; }
  .corps { max-width: 860px; margin: 24px; }
  table { width: 100%; border-collapse: collapse; margin: 12px 0; }
  th { text-align: left; color: #5C6773; font-size: 13px; border-bottom: 2px solid #2F6B4F; padding: 6px 8px; }
  td { border-bottom: 1px solid #E2E8E3; padding: 10px 8px; }
  form.inline { display: inline-block; }
  input[type=number] { width: 64px; padding: 6px; border: 1px solid #D8E0DA; border-radius: 6px; }
  .btn { background: #2F6B4F; color: #FFFFFF; border: 0; border-radius: 6px; padding: 7px 12px; font-weight: 600; cursor: pointer; }
  .btn-gris { background: #FFFFFF; color: #B04A2F; border: 1px solid #B04A2F; border-radius: 6px; padding: 7px 12px; font-weight: 600; cursor: pointer; }
  .total { font-size: 20px; font-weight: 800; color: #1F4F37; margin: 14px 0; }
  .commander { background: #2F6B4F; color: #FFFFFF; border: 0; border-radius: 6px; padding: 14px 26px; font-size: 16px; font-weight: 800; cursor: pointer; }
  .vide { color: #5C6773; }
</style>
</head>
<body>
<header><a class="brand" href="/">ShopNow</a></header>

<div class="corps">
  <h1>Mon panier</h1>

  <table th:if="${!lignes.isEmpty()}">
    <tr><th>Produit</th><th>Prix unitaire</th><th>Quantité</th><th>Sous-total</th><th></th></tr>
    <tr th:each="ligne : ${lignes}">
      <td th:text="${ligne.key.nom}">Produit</td>
      <td th:text="'€ ' + ${#numbers.formatDecimal(ligne.key.prix,1,2)}">10.00</td>
      <td>
        <form class="inline" th:action="@{'/panier/modifier/' + ${ligne.key.id}}" method="post">
          <input type="number" name="quantite" min="0" th:value="${ligne.value}"/>
          <button class="btn" type="submit" data-testid="modifier-quantite">OK</button>
        </form>
      </td>
      <td th:text="'€ ' + ${#numbers.formatDecimal(ligne.key.prix * ligne.value,1,2)}">20.00</td>
      <td>
        <form class="inline" th:action="@{'/panier/supprimer/' + ${ligne.key.id}}" method="post">
          <button class="btn-gris" type="submit" data-testid="supprimer-ligne">Supprimer</button>
        </form>
      </td>
    </tr>
  </table>

  <div class="vide" th:if="${lignes.isEmpty()}">Votre panier est vide. <a href="/">Retour au catalogue</a>.</div>

  <div class="total" th:if="${!lignes.isEmpty()}" th:text="'Total : € ' + ${#numbers.formatDecimal(total,1,2)}">Total</div>

  <form th:if="${!lignes.isEmpty()}" action="/commande/creer" method="post">
    <button class="commander" type="submit" data-testid="commander">Commander</button>
  </form>
</div>
</body>
</html>
