<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<title th:text="'ShopNow — ' + ${produit.nom}">Produit</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; color: #262A2E; background: #FFFFFF; }
  header { background: #FFFFFF; border-bottom: 2px solid #2F6B4F; padding: 14px 24px; }
  .brand { font-size: 20px; font-weight: 800; color: #1F4F37; text-decoration: none; }
  .fiche { max-width: 720px; margin: 30px 24px; }
  .cat { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #2F6B4F; }
  h1 { font-size: 28px; color: #1F4F37; margin: 4px 0; }
  .desc { font-size: 15px; color: #5C6773; }
  .prix { font-size: 26px; font-weight: 800; margin: 14px 0; }
  button { background: #2F6B4F; color: #FFFFFF; border: 0; border-radius: 6px; padding: 12px 22px; font-size: 15px; font-weight: 700; cursor: pointer; }
  a.retour { display: inline-block; margin-top: 18px; color: #2F6B4F; }
</style>
</head>
<body>
<header><a class="brand" href="/">ShopNow</a></header>

<div class="fiche">
  <div class="cat" th:text="${produit.categorie}">Audio</div>
  <h1 th:text="${produit.nom}">Produit</h1>
  <p class="desc" th:text="${produit.description}">description</p>
  <div class="prix" th:text="'€ ' + ${#numbers.formatDecimal(produit.prix,1,2)}">89.99</div>

  <form th:action="@{'/panier/ajouter/' + ${produit.id}}" method="post">
    <button type="submit" data-testid="ajouter-panier">Ajouter au panier</button>
  </form>
  <a class="retour" href="/">← Retour au catalogue</a>
</div>
</body>
</html>
