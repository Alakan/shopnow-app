<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<title>ShopNow — Connexion</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; color: #262A2E; background: #FFFFFF; display: flex; min-height: 100vh; align-items: center; justify-content: center; }
  .carte { width: 360px; border: 1px solid #E2E8E3; border-top: 4px solid #2F6B4F; border-radius: 8px; padding: 26px; }
  h1 { font-size: 20px; color: #1F4F37; margin-top: 0; }
  label { font-size: 13px; color: #5C6773; }
  input { width: 100%; padding: 9px; border: 1px solid #D8E0DA; border-radius: 6px; margin: 4px 0 14px; }
  .btn { width: 100%; background: #2F6B4F; color: #FFFFFF; border: 0; border-radius: 6px; padding: 11px; font-weight: 700; cursor: pointer; }
  .erreur { color: #B04A2F; font-size: 13px; margin-bottom: 10px; }
  p.alt { font-size: 13px; color: #5C6773; }
</style>
</head>
<body>
<div class="carte">
  <h1>Connexion à ShopNow</h1>
  <div class="erreur" th:if="${erreur}" th:text="${erreur}">erreur</div>
  <form action="/connexion" method="post">
    <label>Email</label>
    <input type="email" name="email" data-testid="email" required/>
    <label>Mot de passe</label>
    <input type="password" name="motDePasse" data-testid="mot-de-passe" required/>
    <button class="btn" type="submit" data-testid="btn-connexion">Se connecter</button>
  </form>
  <p class="alt">Pas encore de compte ? <a href="/inscription">Inscrivez-vous</a>.</p>
</div>
</body>
</html>
