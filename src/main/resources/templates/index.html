<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<title>ShopNow — Catalogue</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; color: #262A2E; background: #FFFFFF; }
  header { background: #FFFFFF; border-bottom: 2px solid #2F6B4F; padding: 14px 24px; display: flex; gap: 24px; align-items: center; }
  .brand { font-size: 20px; font-weight: 800; color: #1F4F37; }
  nav a { margin-right: 16px; color: #262A2E; text-decoration: none; font-weight: 600; }
  nav a:hover { color: #2F6B4F; }
  .user { margin-left: auto; color: #5C6773; font-size: 14px; }
  form.recherche { display: flex; gap: 8px; margin: 18px 24px; }
  input[type=text] { flex: 1; max-width: 420px; padding: 8px 10px; border: 1px solid #D8E0DA; border-radius: 6px; }
  button { background: #2F6B4F; color: #FFFFFF; border: 0; border-radius: 6px; padding: 8px 16px; font-weight: 600; cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; padding: 6px 24px 30px; }
  .card { border: 1px solid #E2E8E3; border-top: 4px solid #2F6B4F; border-radius: 8px; padding: 14px; text-decoration: none; color: inherit; display: block; }
  .card h2 { margin: 0 0 4px; font-size: 16px; color: #1F4F37; }
  .card .cat { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #2F6B4F; }
  .card .prix { font-size: 18px; font-weight: 700; margin-top: 8px; color: #262A2E; }
  .card .desc { font-size: 13px; color: #5C6773; }
  .vide { padding: 30px; color: #5C6773; }
</style>
</head>
<body>
<header>
  <span class="brand">ShopNow</span>
  <nav>
    <a href="/">Accueil</a>
    <a href="/panier" data-testid="lien-panier">Panier</a>
    <a href="/commandes">Mes commandes</a>
  </nav>
  <div class="user" th:if="${session.utilisateur != null}" th:text="'Bonjour, ' + ${session.utilisateur.nom}">Bonjour</div>
  <div class="user" th:unless="${session.utilisateur != null}">
    <a href="/connexion">Connexion</a> · <a href="/inscription">Inscription</a>
  </div>
</header>

<form class="recherche" method="get" action="/">
  <input type="text" name="q" data-testid="recherche" th:value="${q}" placeholder="Rechercher un produit…"/>
  <button type="submit" data-testid="btn-rechercher">Rechercher</button>
</form>

<div class="grid">
  <a class="card" th:each="p : ${produits}"
     th:href="@{'/produit/' + ${p.id}}"
     th:attr="data-testid=${'produit-' + p.id}">
    <div class="cat" th:text="${p.categorie}">Audio</div>
    <h2 th:text="${p.nom}">Produit</h2>
    <div class="desc" th:text="${p.description}">description</div>
    <div class="prix" th:text="'€ ' + ${#numbers.formatDecimal(p.prix,1,2)}">89.99</div>
  </a>
</div>
<div class="vide" th:if="${produits.isEmpty()}">Aucun produit trouvé pour ce critère.</div>
</body>
</html>
