<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<title>ShopNow — Mes commandes</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; color: #262A2E; background: #FFFFFF; }
  header { background: #FFFFFF; border-bottom: 2px solid #2F6B4F; padding: 14px 24px; }
  .brand { font-size: 20px; font-weight: 800; color: #1F4F37; text-decoration: none; }
  .corps { max-width: 860px; margin: 24px; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th { text-align: left; color: #5C6773; font-size: 13px; border-bottom: 2px solid #2F6B4F; padding: 6px 8px; }
  td { border-bottom: 1px solid #E2E8E3; padding: 10px 8px; }
  a.cmd { text-decoration: none; color: inherit; font-weight: 700; color: #1F4F37; }
  .vide { color: #5C6773; }
</style>
</head>
<body>
<header><a class="brand" href="/">ShopNow</a></header>

<div class="corps">
  <h1>Mes commandes</h1>
  <table th:if="${!commandes.isEmpty()}">
    <tr><th>N°</th><th>Date</th><th>Statut</th><th>Total</th></tr>
    <tr th:each="c : ${commandes}">
      <td><a class="cmd" th:href="@{'/commande/' + ${c.id}}"
             th:attr="data-testid=${'commande-' + c.id}" th:text="${c.id}">1</a></td>
      <td th:text="${#temporals.format(c.creeeLe, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
      <td th:text="${T(com.shopnow.web.CommandesController).libelle(c)}">COMMANDE CRÉÉE</td>
      <td th:text="'€ ' + ${#numbers.formatDecimal(c.total,1,2)}">10.00</td>
    </tr>
  </table>
  <div class="vide" th:if="${commandes.isEmpty()}">Aucune commande pour le moment.</div>
</div>
</body>
</html>
