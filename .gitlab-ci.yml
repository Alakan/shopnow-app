# Pipeline GitLab CI minimal — socle du TP (atelier A5 du Volet A).
# Cf. le document « TP — Outillage de tests & pipeline d'intégration continue ».

stages:
  - build
  - report

build:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn --batch-mode clean verify
  artifacts:
    paths:
      - target/surefire-reports/
    expire_in: 1 week
    when: always

report:
  stage: report
  image: alpine:3.19
  dependencies: [build]
  script:
    - ls -la target/surefire-reports/
  artifacts:
    paths:
      - target/surefire-reports/*.xml
    expire_in: 2 weeks
