version: "3.9"

services:
  app:
    build: .
    container_name: shopnow-app
    ports:
      - "8081:8080"                 # exposé sur 8081 pour éviter tout conflit avec Jenkins
    environment:
      PORT: 8080
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  jenkins:
    image: jenkins/jenkins:lts
    container_name: shopnow-jenkins
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   # permet aux jobs de piloter docker

  sonarqube:
    image: sonarqube:lts-community
    container_name: shopnow-sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"

  # Instance GitLab LE locale (optionnelle : à n'utiliser que si aucune instance
  # GitLab n'est fournie — lourde en mémoire, 12 Go de RAM recommandés).
  # gitlab:
  #   image: gitlab/gitlab-ce:latest
  #   container_name: shopnow-gitlab
  #   ports:
  #     - "8082:80"
  #     - "8022:22"
  #   volumes:
  #     - gitlab_data:/var/opt/gitlab

volumes:
  jenkins_home:
  # gitlab_data:
